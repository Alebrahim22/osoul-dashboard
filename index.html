<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أصول — نظام التداول الورقي</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-primary:#070b14;
  --bg-secondary:#0f1629;
  --bg-card:#131c33;
  --bg-card-hover:#182240;
  --border:#1e2a45;
  --border-accent:#2a3a5c;
  --text-primary:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --accent:#f59e0b;
  --accent-glow:rgba(245,158,11,0.15);
  --green:#22c55e;
  --green-bg:rgba(34,197,94,0.12);
  --red:#ef4444;
  --red-bg:rgba(239,68,68,0.12);
  --blue:#3b82f6;
  --blue-bg:rgba(59,130,246,0.12);
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,0.3),0 1px 2px rgba(0,0,0,0.2);
  --shadow-lg:0 10px 25px rgba(0,0,0,0.4),0 4px 10px rgba(0,0,0,0.3);
  --font-arabic:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --font-english:'Inter',system-ui,-apple-system,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-arabic);
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
body.en{font-family:var(--font-english)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-accent)}
.app{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;
  flex-wrap:wrap;gap:12px;
}
.header-left{display:flex;align-items:center;gap:16px}
.logo{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  font-size:22px;font-weight:700;color:var(--text-primary);
}
.logo-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#d97706);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#0a0e17;
}
.logo span{background:linear-gradient(135deg,var(--accent),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;
}
.badge-live{background:var(--green-bg);color:var(--green)}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.header-right{display:flex;align-items:center;gap:12px}
.update-time{font-size:13px;color:var(--text-muted);direction:ltr}
.lang-toggle{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);
  padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;
  transition:all 0.2s;
}
.lang-toggle:hover{background:var(--bg-card-hover);color:var(--text-primary)}
/* Navigation Tabs */
.nav-tabs{
  display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;
}
.nav-tab{
  padding:10px 20px;border-radius:24px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-secondary);font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.25s;font-family:inherit;
  display:flex;align-items:center;gap:8px;
}
.nav-tab:hover{background:var(--bg-card-hover);color:var(--text-primary);border-color:var(--border-accent)}
.nav-tab.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent);box-shadow:0 0 20px rgba(245,158,11,0.1)}
.nav-tab .tab-icon{font-size:16px}
/* KPI Grid */
.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:24px;
}
.kpi-grid-5{grid-template-columns:repeat(5,1fr)}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
  transition:all 0.2s;position:relative;overflow:hidden;
}
.kpi-card:hover{background:var(--bg-card-hover);border-color:var(--border-accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.kpi-label{font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1.2}
.kpi-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-accent{color:var(--accent)}
.text-blue{color:var(--blue)}
.kpi-icon{
  position:absolute;top:16px;left:16px;font-size:24px;opacity:0.15;
}
/* Section */
.section{margin-bottom:24px}
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.section-title{font-size:18px;font-weight:600;color:var(--text-primary)}
.section-subtitle{font-size:13px;color:var(--text-muted)}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.card-full{grid-column:1/-1}
.card-chart{padding:16px;position:relative}
.chart-container{position:relative;width:100%;height:260px}
.chart-container-sm{height:200px}
.chart-container-lg{height:320px}
/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  text-align:right;padding:10px 14px;
  color:var(--text-muted);font-weight:500;font-size:12px;
  border-bottom:1px solid var(--border);white-space:nowrap;
  text-transform:uppercase;letter-spacing:0.5px;
}
tbody td{
  padding:12px 14px;border-bottom:1px solid rgba(30,42,69,0.5);
  white-space:nowrap;font-size:13px;
}
tbody tr:hover{background:rgba(255,255,255,0.02)}
tbody tr:last-child td{border-bottom:none}
.ticker-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;
}
.ticker-us{background:var(--blue-bg);color:var(--blue)}
.ticker-kw{background:var(--accent-glow);color:var(--accent)}
/* Progress Bar */
.progress-bar{
  width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;
}
.progress-fill{
  height:100%;border-radius:2px;transition:width 0.3s;
}
.progress-fill.green{background:var(--green)}
.progress-fill.accent{background:var(--accent)}
.status-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500;
}
.status-active{background:var(--green-bg);color:var(--green)}
.status-warning{background:var(--accent-glow);color:var(--accent)}
.status-closed{background:rgba(148,163,184,0.1);color:var(--text-muted)}
/* Market Compare */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.compare-card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.compare-card-title{font-size:15px;font-weight:600}
.compare-metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(30,42,69,0.3);font-size:13px}
.compare-metric:last-child{border-bottom:none}
.compare-label{color:var(--text-secondary)}
.compare-value{font-weight:600}
/* Score Categories */
.score-list{display:flex;flex-direction:column;gap:8px}
.score-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.02)}
.score-item:hover{background:rgba(255,255,255,0.04)}
.score-cat{font-size:12px;color:var(--text-muted);width:70px;font-weight:500}
.score-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.score-num{font-size:13px;font-weight:600;width:36px;text-align:left;direction:ltr}
/* Activity */
.activity-list{display:flex;flex-direction:column;gap:2px}
.activity-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius-sm);
  font-size:13px;border-bottom:1px solid rgba(30,42,69,0.3);
}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.activity-dot.buy{background:var(--green)}
.activity-dot.sell{background:var(--red)}
.activity-dot.scan{background:var(--blue)}
.activity-dot.info{background:var(--accent)}
.activity-text{flex:1}
.activity-time{font-size:11px;color:var(--text-muted);white-space:nowrap;direction:ltr}
/* Status Bar */
.status-bar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:24px;font-size:13px;
}
.status-item{display:flex;align-items:center;gap:6px}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.green{background:var(--green)}
.status-dot.yellow{background:var(--accent)}
/* Footer */
.footer{
  margin-top:40px;padding-top:20px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  font-size:12px;color:var(--text-muted);
}
.footer-links{display:flex;gap:16px}
.footer-links a{color:var(--text-muted);text-decoration:none;transition:color 0.2s}
.footer-links a:hover{color:var(--text-secondary)}
/* Page visibility */
.page{display:none}
.page.active{display:block}
/* Loading */
.loading{
  text-align:center;padding:60px 20px;color:var(--text-muted);
}
.loading-spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* Tooltip */
[data-tooltip]{position:relative}
[data-tooltip]:hover::after{
  content:attr(data-tooltip);position:absolute;bottom:calc(100% + 6px);
  right:50%;transform:translateX(50%);
  background:#1e293b;color:var(--text-primary);padding:4px 10px;
  border-radius:4px;font-size:11px;white-space:nowrap;z-index:10;
  border:1px solid var(--border);
}
/* Error state */
.error-state{text-align:center;padding:80px 20px}
.error-state .error-icon{font-size:64px;margin-bottom:16px;opacity:0.5}
.error-state h2{font-size:24px;margin-bottom:8px;color:var(--text-primary)}
.error-state p{color:var(--text-muted);margin-bottom:24px}
.error-state .retry-btn{
  background:var(--accent);color:#0a0e17;border:none;padding:10px 28px;
  border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all 0.2s;
}
.error-state .retry-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(245,158,11,0.3)}
/* Stock Cards Grid */
.stock-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
}
.stock-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
  cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;
}
.stock-card:hover{background:var(--bg-card-hover);border-color:var(--border-accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stock-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stock-ticker{font-size:16px;font-weight:700}
.stock-market{font-size:14px}
.stock-name{font-size:12px;color:var(--text-secondary);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-sector{font-size:11px;color:var(--text-muted);margin-bottom:12px}
.stock-score-row{display:flex;align-items:center;justify-content:space-between}
.stock-score{font-size:28px;font-weight:700;line-height:1}
.stock-class{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500}
/* Score colors */
.score-green{color:var(--green)}
.score-blue{color:var(--blue)}
.score-amber{color:var(--accent)}
.score-red{color:var(--red)}
.class-green{background:var(--green-bg);color:var(--green)}
.class-blue{background:var(--blue-bg);color:var(--blue)}
.class-amber{background:var(--accent-glow);color:var(--accent)}
.class-red{background:var(--red-bg);color:var(--red)}
/* Stock Detail */
.stock-detail{display:none}
.stock-detail.active{display:block}
.back-btn{
  background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);
  padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;
  transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;
}
.back-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.stock-detail-header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.stock-detail-ticker{font-size:28px;font-weight:700}
.stock-detail-name{font-size:16px;color:var(--text-secondary)}
.stock-detail-sector{font-size:13px;color:var(--text-muted);padding:4px 10px;background:rgba(255,255,255,0.04);border-radius:6px}
.stock-detail-class{padding:4px 12px;border-radius:8px;font-size:13px;font-weight:500}
.stock-detail-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stock-detail-left{display:flex;flex-direction:column;gap:16px}
.stock-detail-right{display:flex;flex-direction:column;gap:16px}
.score-gauge{
  text-align:center;padding:24px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);
}
.score-gauge-number{font-size:64px;font-weight:800;line-height:1}
.score-gauge-label{font-size:14px;color:var(--text-secondary);margin-top:8px}
.score-gauge-sub{font-size:12px;color:var(--text-muted)}
.method-bars{display:flex;flex-direction:column;gap:10px}
.method-bar-item{display:flex;align-items:center;gap:10px}
.method-label{font-size:12px;color:var(--text-secondary);width:80px;flex-shrink:0;font-weight:500}
.method-bar-wrap{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.method-bar-fill{height:100%;border-radius:5px;transition:width 0.6s ease}
.method-score{font-size:13px;font-weight:600;width:30px;text-align:left;direction:ltr}
.classification-box{
  padding:16px;background:rgba(255,255,255,0.02);border:1px solid var(--border);
  border-radius:var(--radius);text-align:center;
}
.classification-box .class-title{font-size:16px;font-weight:600;margin-bottom:6px}
.classification-box .class-desc{font-size:13px;color:var(--text-secondary);line-height:1.7}
/* Score Distribution labels */
.score-dist-labels{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.score-dist-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.score-dist-dot{width:10px;height:10px;border-radius:50%}
/* Compact KPI for Lite */
.kpi-compact .kpi-card{padding:14px 16px}
.kpi-compact .kpi-value{font-size:22px}
.kpi-compact .kpi-label{font-size:11px;margin-bottom:4px}
/* Error */
.error-message{color:var(--red);font-size:13px;padding:12px;background:var(--red-bg);border-radius:var(--radius-sm);margin-bottom:16px;display:none}
/* Responsive */
@media(max-width:1024px){
  .stock-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-grid-5{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .app{padding:12px 14px 30px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-grid-5{grid-template-columns:repeat(2,1fr)}
  .kpi-card{padding:14px}
  .kpi-value{font-size:22px}
  .grid-2,.grid-3,.compare-grid{grid-template-columns:1fr}
  .header{flex-direction:column;align-items:flex-start}
  .header-right{width:100%;justify-content:space-between}
  .chart-container{height:200px}
  .chart-container-lg{height:240px}
  .card{padding:14px}
  table{font-size:12px}
  thead th, tbody td{padding:8px 10px}
  .progress-bar{width:60px}
  .stock-grid{grid-template-columns:repeat(2,1fr)}
  .stock-detail-body{grid-template-columns:1fr}
  .nav-tab{padding:8px 14px;font-size:13px}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}
  .kpi-grid-5{grid-template-columns:1fr 1fr}
  .kpi-card{padding:12px}
  .kpi-value{font-size:18px}
  .kpi-label{font-size:11px}
  .section-title{font-size:16px}
  .stock-grid{grid-template-columns:1fr}
}
/* Compact tables for Lite */
.table-compact tbody td{padding:8px 10px;font-size:12px}
.table-compact thead th{padding:6px 10px;font-size:10px}
/* Hint for chart */
.chart-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px}
/* Radial score ring */
.radial-score{position:relative;width:140px;height:140px;margin:0 auto}
.radial-score svg{transform:rotate(-90deg)}
.radial-score .bg-circle{fill:none;stroke:var(--border);stroke-width:6}
.radial-score .progress-circle{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease}
.radial-score .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:800;text-align:center;line-height:1}
.radial-score .score-text .score-label{display:block;font-size:11px;font-weight:400;color:var(--text-muted);margin-top:2px}
/* Page transition */
.page{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Loading State -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>جاري تحميل البيانات...</div>
  </div>
</div>

<script>
// ============================================================
// LANGUAGE
// ============================================================
let currentLang = localStorage.getItem('osoul-lang') || 'ar';

function t(ar, en) {
  return currentLang === 'ar' ? ar : (en || ar);
}

// ============================================================
// HELPERS
// ============================================================
function formatCurrency(val, market) {
  if (market === 'KW') return val.toFixed(3) + ' د.ك';
  return '$' + val.toFixed(2);
}

function formatPercent(val) {
  const sign = val >= 0 ? '+' : '';
  return sign + val.toFixed(2) + '%';
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString(currentLang === 'ar' ? 'ar-KW' : 'en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });
}

function timeSince(dateStr) {
  const now = new Date();
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return t('غير معروف', 'Unknown');
  const diff = Math.abs(Math.floor((now - d) / 60000));
  if (diff < 60) return t(`منذ ${diff} دقيقة`, `${diff}m ago`);
  const hrs = Math.floor(diff / 60);
  if (hrs < 24) return t(`منذ ${hrs} ساعة`, `${hrs}h ago`);
  const days = Math.floor(hrs / 24);
  if (days < 30) return t(`منذ ${days} يوم`, `${days}d ago`);
  return formatDate(dateStr);
}

function getScoreColor(score) {
  if (score >= 8) return 'score-green';
  if (score >= 6) return 'score-blue';
  if (score >= 4) return 'score-amber';
  return 'score-red';
}

function getScoreHex(score) {
  if (score >= 8) return '#22c55e';
  if (score >= 6) return '#3b82f6';
  if (score >= 4) return '#f59e0b';
  return '#ef4444';
}

function getClassClass(classification) {
  const c = classification || '';
  if (c.includes('ممتاز') || c === 'Excellent') return 'class-green';
  if (c.includes('جيد') || c.includes('Good')) return 'class-blue';
  if (c.includes('متوسط') || c.includes('Average')) return 'class-amber';
  return 'class-red';
}

function getClassColor(classification) {
  const c = classification || '';
  if (c.includes('ممتاز') || c === 'Excellent') return '#22c55e';
  if (c.includes('جيد') || c.includes('Good')) return '#3b82f6';
  if (c.includes('متوسط') || c.includes('Average')) return '#f59e0b';
  return '#ef4444';
}

// ============================================================
// CHART MANAGER
// ============================================================
let chartInstances = {};

function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
  chartInstances = {};
}

// ============================================================
// ROUTER
// ============================================================
function getRoute() {
  const hash = window.location.hash || '#dashboard';
  if (hash.startsWith('#stock=')) return { page: 'stock', ticker: hash.replace('#stock=', '') };
  if (hash === '#lite') return { page: 'lite' };
  if (hash === '#stocks') return { page: 'stocks' };
  return { page: 'dashboard' };
}

function navigateTo(hash) {
  window.location.hash = hash;
}

window.addEventListener('hashchange', () => {
  const data = window._d;
  if (data) render(data);
});

// ============================================================

function renderPage(d, route) {

      <div class="table-wrap">
        <table class="table-compact" dir="${dir}">
          <thead>
            <tr>
              <th>${t('السهم', 'Ticker')}</th>
              <th>${t('السوق', 'Mkt')}</th>
              <th>${t('تاريخ الخروج', 'Exit')}</th>
              <th>${t('الربح/الخسارة', 'P&L')}</th>
              <th>${t('المدة', 'Days')}</th>
              <th>${t('النتيجة', 'Result')}</th>
            </tr>
          </thead>
          <tbody>
            ${d.lastTrades.slice(0, 5).map(tr => `
              <tr>
                <td><strong>${tr.ticker}</strong></td>
                <td><span style="font-size:13px">${tr.market === 'US' ? '🇺🇸' : '🇰🇼'}</span></td>
                <td dir="ltr" style="font-size:12px">${formatDate(tr.exitDate)}</td>
                <td class="${tr.pnl >= 0 ? 'text-green' : 'text-red'}" dir="ltr">${formatPercent(tr.pnl)}</td>

  `;
}

// Stock list filter functions
function filterStockCards(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.stock-card').forEach(card => {
    const ticker = card.dataset.ticker.toLowerCase();
    const name = card.dataset.name.toLowerCase();
    const match = !q || ticker.includes(q) || name.includes(q);
    card.style.display = match ? '' : 'none';
  });
}

function filterStockMarket(market, btn) {
  document.querySelectorAll('.stock-filter').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.stock-card').forEach(card => {
    if (market === 'all') {
      card.style.display = '';
    } else {
      card.style.display = card.dataset.market === market ? '' : 'none';
    }
  });
}

function renderStockDetail(d, ticker) {
  const stock = d.stocks.find(s => s.ticker === ticker);
  const dir = currentLang === 'ar' ? 'rtl' : 'ltr';

  if (!stock) {
    return `
      <button class="back-btn" onclick="navigateTo('#stocks')">← ${t('رجوع', 'Back')}</button>

      </div>

  const methods = stock.methods || [];
  const radarLabels = methods.map(m => m.label || m.method);
  const radarScores = methods.map(m => m.score);

    const map = { 'Buffett': '#22c55e', 'Graham': '#3b82f6', 'Lynch': '#f59e0b', 'ONeil': '#a855f7', 'Piotroski': '#06b6d4' };
    return map[m.method] || '#3b82f6';

  const percent = (stock.overallScore / 10) * 100;
  const circumference = 2 * Math.PI * 56; // r=56
  const offset = circumference - (percent / 100) * circumference;
  const scoreHex = getScoreHex(stock.overallScore);

  let classDesc = '';

  if (cls.includes('ممتاز') || cls === 'Excellent') {

    classDesc = t('السهم يتمتع بأساسيات جيدة مع بعض نقاط القوة في طرق تحليل محددة. مرشح جيد للاستثمار مع مراقبة مستمرة.', 'The stock has good fundamentals with strengths in specific analysis methods. A good candidate for investment with continuous monitoring.');

    classDesc = t('السهم لديه بعض نقاط القوة ولكن يحتاج إلى تقييم دقيق. قد يكون مناسباً للمستثمرين ذوي المخاطر المتوسطة.', 'The stock has some strengths but needs careful evaluation. May be suitable for medium-risk investors.');

  }

  return `
    <button class="back-btn" onclick="navigateTo('#stocks')">← ${t('رجوع إلى قائمة الأسهم', 'Back to stock list')}</button>

    <!-- Stock Detail Header -->
    <div class="stock-detail-header" dir="${dir}">
      <span class="stock-detail-ticker">${stock.ticker}</span>
      <span style="font-size:22px">${stock.market === 'US' ? '🇺🇸' : '🇰🇼'}</span>
      <span class="stock-detail-name">${stock.name}</span>
      <span class="stock-detail-sector">${stock.sector}</span>
      <span class="stock-detail-class ${getClassClass(stock.classification)}">${stock.classification}</span>
    </div>

    <div class="stock-detail-body" dir="${dir}">
      <!-- Left Column -->
      <div class="stock-detail-left">
        <!-- Radial Score Gauge -->
        <div class="score-gauge">
          <div class="radial-score">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <circle class="bg-circle" cx="70" cy="70" r="56"/>
              <circle class="progress-circle" cx="70" cy="70" r="56" 
                stroke="${scoreHex}" 
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${offset}" 
                style="transition: stroke-dashoffset 0.8s ease"/>
            </svg>
            <div class="score-text" style="color:${scoreHex}">
              ${stock.overallScore.toFixed(1)}
              <span class="score-label">${t('الدرجة الكلية', 'Overall Score')}</span>
            </div>
          </div>
          <div style="margin-top:8px">
            <span class="stock-class ${getClassClass(stock.classification)}" style="font-size:14px;padding:6px 16px">${stock.classification}</span>
          </div>
        </div>

        <!-- Method Score Bars -->
        <div class="card" style="padding:16px">

            ${methods.map(m => {

              const pct = (m.score / 10) * 100;
              return `
                <div class="method-bar-item">
                  <span class="method-label">${m.label || m.method}</span>
                  <div class="method-bar-wrap">
                    <div class="method-bar-fill" style="width:${pct}%;background:${color}"></div>

      <!-- Right Column -->

// LANGUAGE TOGGLE
// ============================================================
function toggleLang() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('osoul-lang', currentLang);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.body.className = currentLang === 'en' ? 'en' : '';
  render(window._d);
}

// ============================================================
// DATA LOADER
// ============================================================
async function loadData() {
  try {
    const resp = await fetch('./data.json');
    if (resp.ok) {
      const json = await resp.json();
      window._d = json;
      render(json);
    } else {
      throw new Error('Failed to fetch');
    }
  } catch(e) {
    // Show error state
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <h2>${t('فشل تحميل البيانات', 'Failed to load data')}</h2>
        <p>${t('تعذر تحميل data.json. يرجى التأكد من وجود الملف.', 'Could not load data.json. Please ensure the file exists.')}</p>
        <button class="retry-btn" onclick="loadData()">${t('إعادة المحاولة', 'Retry')}</button>
      </div>
    `;
    console.error('Data load error:', e);
  }
}
